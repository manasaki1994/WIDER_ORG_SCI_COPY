  - abstract
  - keywords
logic:
  and:
  - or:
    - speaking_up
  - or:
    - at_work
notes: Written by hand for the interactive demo (showcase/demo), so the Search strings page shows two short blocks a
  first-time visitor can read. A paper must use a word from each block.
