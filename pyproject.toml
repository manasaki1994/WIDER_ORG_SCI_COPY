[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wider"
version = "0.0.1"
description = "A literature review AI tool for broad, multi-vocabulary constructs: benchmark-guided search, deduplication, anchor ranking, human and LLM screening, recall estimation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Anonymous"}]
keywords = ["systematic review", "literature review", "screening", "LLM", "embeddings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.25",
  "rispy>=0.9",
  "rapidfuzz>=3",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "jsonschema>=4",
  "jinja2>=3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "anyascii>=0.3",
  "python-docx>=1.1",   # Word checklists and methods document (prisma-reporting-assistant D22)
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.7", "torch>=2.1"]
litellm = ["litellm>=1.40"]
import = ["openpyxl>=3.1", "xlrd>=2.0", "bibtexparser>=1.4"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3", "ruff>=0.5", "pypdf>=4"]

[project.scripts]
wider = "wider.cli:app"

[tool.setuptools.packages.find]
include = ["wider*"]

[tool.setuptools.package-data]
wider = ["*.yaml", "**/*.yaml", "**/*.j2", "**/*.json", "**/*.md", "ui/static/*", "ui/static/fonts/*", "sample/package_page/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = ["slow: long simulation checks, run weekly in CI (pytest -m slow)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
