python: '3.11'
outside:
  modules:
    wider/rank/update.py: the guided re-run of the ranking; plumbing, no method
    wider/rank/versions.py: version records, input hashes and needs-review flags; provenance, no method
    wider/embeddings/cache.py: a cache of embeddings, no method
    wider/embeddings/sentence_transformers.py: a backend adapter (batching, retries), no method
    wider/embeddings/ollama.py: a backend adapter (batching, retries), no method
    wider/embeddings/openai_compat.py: a backend adapter (batching, retries), no method
    wider/embeddings/fake.py: a hashed bag-of-words backend used only in tests
    wider/construct/benchmark.py: reads benchmark.csv into a table and fetches abstracts by DOI; IO, no method
    wider/recall/independent.py: capture-recapture and Clopper-Pearson on independent seed papers; query-side, to
      be placed by a later topic (owner question)
    wider/recall/adjacent.py: counts exclusions per adjacent literature for the report; no method
    wider/recall/selection.py: record selection and export; no method
    wider/recall/docx_shapes.py: Word drawing markup for the flow diagram; layout, no method
    wider/recall/reporting_docx.py: writes the Word copies of the reporting exports; layout, no method
    wider/recall/dashboard.py: assembles the Results page; layout, no method
    wider/screen/decisions.py: stores decisions and imports CSV decisions; IO, no method
    wider/screen/export.py: CSV export; no method
    wider/screen/models_summary.py: usage and cost summary; no method
    wider/screen/preflight.py: refusal checks before a run; no method
    wider/screen/progress.py: read-only status, steps and counts; no method
    wider/screen/result_sets.py: rerun bookkeeping and the active result set; no method
  settings:
    sampling.plan_seconds: a time limit; a plan that runs out of time is marked approximate
    recall.suggest_seconds: a time limit; past it the suggestion is marked approximate
    screening.max_tokens: the output budget of one call, not a decision rule (a cut-off answer fails and is reported)
