name: ci
# Weekly on Linux with Python 3.12, and by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check wider tests scripts
      - run: python scripts/check_no_private_data.py $(git ls-files)
      - run: pytest -q -n auto
      - run: pytest -q -m slow
